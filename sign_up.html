<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="css/sign_up.css">
</head>
<body>  
    <div id="container">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" id="svg1"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
        </svg>
       
        <h1><b>Création de compte</b></h1>
        <p id="creat">Creer un compte afin de débloquer toute les fonctionnalités, modifier son profil, liker son mentor/ Intervenant ou rechercher des étudiants.</p>
        
        <div id="buttons">
            <a href="http://localhost:3000/auth/google">
            <button class="logo_faang"  href="http://localhost:3000/auth/google">
                <img src="https://img.icons8.com/color/512/google-logo.png"/>
                <p class="button_text">
                Sign up with google
                </p>
            </button>
            </a>
  
        
            <button class="logo_faang">
                <img src="ynov-logo-rond.svg" alt="Ynov Campus" class="ynov-logo">
                <p class="button_text">
                Sign up with Ynov
                </p>
            </button>
          
          
           
        </div>
        <div id="checkbox">
            <input type="checkbox" id="interested_in_updates" name="interested_in_updates" >
            <label for="interested_in_updates">I'm not interested in update products and services.</label>
        </div>
            
            <a href="#home">Sign in </a>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        id="goback" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-corner-up-left preview-icon">
        <path d="M20 20v-7a4 4 0 0 0-4-4H4" />
        <path d="M9 14 4 9l5-5" />
    </svg>
   
</body>
</html>
